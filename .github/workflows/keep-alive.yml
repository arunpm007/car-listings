# Supabase's free plan pauses a project after a week with no activity. One tiny read a day
# keeps it awake. Needs repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY
# (both are public values, the same ones the website uses).
name: Keep database awake

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 in India
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          curl --fail --silent --show-error -o /dev/null \
            "${{ vars.SUPABASE_URL }}/rest/v1/site_settings?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}"
