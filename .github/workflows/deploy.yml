# Merges to main go live on Netlify: checks first, then the database changes, then the site.
# The database goes first so the new site never runs against an old schema.
#
# Needs, in GitHub → Settings → Environments → production:
#   secrets  SUPABASE_ACCESS_TOKEN   (supabase.com → Account → Access tokens)
#            SUPABASE_DB_PASSWORD    (the database password set when the project was made)
#            NETLIFY_AUTH_TOKEN      (Netlify → User settings → Applications → Personal access tokens)
# and in Settings → Secrets and variables → Actions → Variables (repository level, not secret):
#   SUPABASE_PROJECT_REF   (the id in the project's dashboard address)
#   NETLIFY_SITE_ID        (Netlify → Project configuration → Project ID)
# Netlify's own builds stay stopped; this workflow is the only thing that puts code live.
# Add yourself as a required reviewer on that environment to approve each release by hand.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    # Skipped (grey, not red) until the production environment is set up in GitHub.
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply new database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pnpm exec supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          pnpm exec supabase db push

      # Builds with the environment variables saved on Netlify, then publishes.
      - name: Build and deploy the site to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          pnpm dlx netlify-cli@27 build --context production
          pnpm dlx netlify-cli@27 deploy --prod --message "${{ github.sha }}"
