# Merges to main go live: checks first, then the database changes, then the site.
# The database goes first so the new site never runs against an old schema.
#
# Needs, in GitHub → Settings → Environments → production:
#   secrets  SUPABASE_ACCESS_TOKEN   (supabase.com → Account → Access tokens)
#            SUPABASE_DB_PASSWORD    (the database password set when the project was made)
#            DEPLOY_HOOK_URL         (the host's deploy/build hook; turn off the host's own auto-deploy)
#   variable SUPABASE_PROJECT_REF    (the id in the project's dashboard address)
# Add yourself as a required reviewer on that environment to approve each release by hand.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply new database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pnpm exec supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          pnpm exec supabase db push

      - name: Deploy the site
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
