# Merges to main go live on Netlify: checks first, then the database changes, then the site.
# The database goes first so the new site never runs against an old schema.
#
# Needs, in GitHub → Settings → Environments → production (with you as a required reviewer):
#   secrets  SUPABASE_DB_URL          (Supabase → Connect → Session pooler connection string,
#                                      with the database password filled in. GitHub's runners
#                                      have no IPv6, so the direct database address can't be used.)
#            NETLIFY_BUILD_HOOK_URL   (Netlify → Project configuration → Developer settings →
#                                      Continuous deployment → Build hooks; branch main)
# and in Settings → Secrets and variables → Actions → Variables (repository level, not secret):
#   SUPABASE_PROJECT_REF   (the id in the project's dashboard address; also switches the release on)
#
# Netlify builds the site itself, on its own servers, where the secret keys are readable.
# netlify.toml makes it skip builds on push, so this workflow decides when the site updates.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    # Skipped (grey, not red) until the production environment is set up in GitHub.
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply new database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pnpm exec supabase db push --db-url "$SUPABASE_DB_URL"

      # Netlify then builds main and publishes it; watch it under Deploys in Netlify.
      - name: Ask Netlify to build and publish the site
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL?trigger_title=Deploy+${GITHUB_SHA::7}"
