# Every push to a branch and every pull request: lint, types, tests, then a fresh local Supabase from the
# migrations and a production build against it. Nothing reaches the live site from here.
name: Checks

on:
  pull_request:
  # main is checked as the first step of Deploy.
  push:
    branches-ignore: [main]
  workflow_call:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

      # Proves every migration and the seed apply cleanly on an empty database.
      - name: Start Supabase from the migrations
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

      - name: Production build against it
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          SUPABASE_SECRET_KEY="$SECRET_KEY" \
          NEXT_PUBLIC_SITE_URL=https://ci.invalid \
          pnpm build
